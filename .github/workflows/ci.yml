name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The native engine downloads a pinned, sha256-verified AIST model
      # (141 MB) on first use; fresh runners would fail the engine tests via
      # the documented degradation. Warm it once and cache by the pinned
      # model's sha256 prefix (bump the key when the engine bumps the model).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/augmem
          key: cortext-models-aist-87m-bf4c4995
      - run: node scripts/ci-warm-model.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
